  <rect x="206" y="148" width="22" height="10" rx="5" fill="#2b2d42" stroke="#00f5ff"/>
  <circle cx="48" cy="153" r="8" fill="#ff00aa"/>
  <circle cx="232" cy="153" r="8" fill="#ffe600"/>

  <!-- legs -->
  <rect x="102" y="198" width="18" height="16" rx="4" fill="#2b2d42" stroke="#7b2fff"/>
  <rect x="160" y="198" width="18" height="16" rx="4" fill="#2b2d42" stroke="#7b2fff"/>
</svg>
