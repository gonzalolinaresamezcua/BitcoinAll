<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" role="img" aria-label="Robot ciberpunk PoU">
  <defs>
    <linearGradient id="botBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2d42"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <filter id="botGlow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- speech bubble -->
  <rect x="18" y="12" width="244" height="46" rx="10" fill="#12001f" stroke="#ff00aa" stroke-width="2"/>
  <text x="140" y="32" text-anchor="middle" font-family="monospace" font-size="11" fill="#ff00aa">PoW? Nunca la conoc�.</text>
  <text x="140" y="48" text-anchor="middle" font-family="monospace" font-size="10" fill="#00f5ff">Yo solo existo si el nodo est� ON �</text>
  <path d="M120 58 L110 72 L135 58" fill="#12001f" stroke="#ff00aa" stroke-width="2"/>

  <!-- antenna -->
  <line x1="140" y1="72" x2="140" y2="52" stroke="#00f5ff" stroke-width="3" filter="url(#botGlow)"/>
  <circle cx="140" cy="48" r="6" fill="#ff00aa"/>

  <!-- head -->
  <rect x="95" y="72" width="90" height="62" rx="14" fill="url(#botBody)" stroke="#00f5ff" stroke-width="2.5"/>
  <rect x="112" y="92" width="22" height="14" rx="4" fill="#00f5ff" opacity="0.9"/>
  <rect x="146" y="92" width="22" height="14" rx="4" fill="#00f5ff" opacity="0.9"/>
  <rect x="118" y="96" width="8" height="6" fill="#0f0f1a"/>
  <rect x="152" y="96" width="8" height="6" fill="#0f0f1a"/>
  <path d="M118 118 Q140 128 162 118" fill="none" stroke="#ffe600" stroke-width="2"/>

  <!-- body -->
  <rect x="78" y="140" width="124" height="58" rx="12" fill="url(#botBody)" stroke="#ff00aa" stroke-width="2"/>
  <text x="140" y="165" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#00f5ff">UPTIME</text>
  <rect x="98" y="172" width="84" height="16" rx="4" fill="#0a0a12" stroke="#00f5ff"/>
  <rect x="100" y="174" width="62" height="12" rx="3" fill="#00f5ff" opacity="0.85"/>
  <text x="140" y="184" text-anchor="middle" font-family="monospace" font-size="8" fill="#0a0a12">99.7% ONLINE</text>

