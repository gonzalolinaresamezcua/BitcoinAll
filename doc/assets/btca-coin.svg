<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Moneda BTCA ciberpunk">
  <defs>
    <linearGradient id="coinFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1035"/>
      <stop offset="45%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#240046"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#ff00aa"/>
      <stop offset="100%" stop-color="#ffe600"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- outer glow ring -->
  <circle cx="160" cy="160" r="148" fill="none" stroke="url(#rim)" stroke-width="6" opacity="0.9" filter="url(#neon)"/>
  <circle cx="160" cy="160" r="138" fill="url(#coinFace)" stroke="#00f5ff" stroke-width="2"/>

  <!-- holographic sheen -->
  <ellipse cx="160" cy="110" rx="95" ry="55" fill="url(#glow)"/>

  <!-- circuit traces -->
  <g stroke="#00f5ff" stroke-width="1.5" fill="none" opacity="0.55">
    <path d="M60 160 H95 M225 160 H260 M160 60 V95 M160 225 V260"/>
    <path d="M95 95 L115 115 M205 95 L225 115 M95 225 L115 205 M205 225 L225 205"/>
    <circle cx="115" cy="115" r="4" fill="#ff00aa" stroke="none"/>
    <circle cx="205" cy="115" r="4" fill="#ffe600" stroke="none"/>
    <circle cx="115" cy="205" r="4" fill="#00f5ff" stroke="none"/>
    <circle cx="205" cy="205" r="4" fill="#7b2fff" stroke="none"/>
  </g>

  <!-- inner ring -->
  <circle cx="160" cy="160" r="88" fill="none" stroke="#ff00aa" stroke-width="2" stroke-dasharray="8 6" opacity="0.8"/>

  <!-- BTCA symbol -->
  <text x="160" y="148" text-anchor="middle" font-family="monospace" font-size="52" font-weight="bold" fill="#00f5ff" filter="url(#neon)">�</text>
  <text x="160" y="195" text-anchor="middle" font-family="monospace" font-size="34" font-weight="bold" fill="#ffffff" letter-spacing="6">BTCA</text>
  <text x="160" y="218" text-anchor="middle" font-family="monospace" font-size="11" fill="#ff00aa" letter-spacing="3">PROOF OF UPTIME</text>

  <!-- micro chip -->
  <rect x="138" y="228" width="44" height="22" rx="3" fill="#0a0a12" stroke="#ffe600" stroke-width="1.2"/>
  <path d="M138 234 H130 M138 244 H130 M182 234 H190 M182 244 H190" stroke="#ffe600" stroke-width="1.2"/>
  <text x="160" y="243" text-anchor="middle" font-family="monospace" font-size="8" fill="#ffe600">2026</text>
</svg>
