<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BitcoinAll Explorer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="logo">⛓</div>
        <div>
          <h1>BitcoinAll Explorer</h1>
          <p id="chain-status" class="subtitle">Conectando…</p>
        </div>
      </div>
      <div class="stats-row" id="header-stats"></div>
    </header>

    <form id="search-form" class="search-bar">
      <input type="text" id="search-input" placeholder="Buscar: altura, bloque, txid o dirección btca1…" autocomplete="off">
      <button type="submit" class="btn primary">Buscar</button>
    </form>

    <nav class="tabs">
      <button class="tab active" data-tab="home">Inicio</button>
      <button class="tab" data-tab="blocks">Bloques</button>
      <button class="tab" data-tab="mempool">Mempool</button>
      <button class="tab" data-tab="detail">Detalle</button>
    </nav>

    <main>
      <section id="panel-home" class="panel active">
        <h2>Red BitcoinAll</h2>
        <dl class="info-grid" id="chain-info"></dl>
        <h2>Últimos bloques</h2>
        <div id="home-blocks" class="table-wrap"></div>
      </section>

      <section id="panel-blocks" class="panel">
        <div class="panel-head">
          <h2>Bloques recientes</h2>
          <button type="button" id="refresh-blocks" class="btn secondary btn-sm">Actualizar</button>
        </div>
        <div id="blocks-table" class="table-wrap"></div>
      </section>

      <section id="panel-mempool" class="panel">
        <div class="panel-head">
          <h2>Mempool</h2>
          <button type="button" id="refresh-mempool" class="btn secondary btn-sm">Actualizar</button>
        </div>
        <div id="mempool-table" class="table-wrap"></div>
      </section>

      <section id="panel-detail" class="panel">
        <div id="detail-content">
          <p class="hint">Busca un bloque, transacción o dirección arriba.</p>
        </div>
      </section>
    </main>

    <footer>Solo localhost · Explorador de tu nodo BitcoinAll · txindex activo</footer>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
